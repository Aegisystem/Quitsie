name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web
        working-directory: web
        run: npm run typecheck

      - name: Test web
        working-directory: web
        run: npm test

      - name: Build web into api/cmd/server/dist
        working-directory: web
        run: npm run build

      - name: Vet Go
        working-directory: api
        run: go vet ./...

      - name: Test Go
        working-directory: api
        run: go test ./...

      - name: Scan Go for known vulnerabilities
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build server binary with the PWA embedded
        working-directory: api
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.sha }}" -o bin/quitsie ./cmd/server

      - name: Install Chromium for the end-to-end tests
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test the binary end to end
        working-directory: web
        timeout-minutes: 5
        run: npx playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: web/e2e/results
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quitsie-linux-amd64
          path: api/bin/quitsie
          retention-days: 14

  # What only runs on the VM or in GitHub (deploy/ and these workflows) is
  # checked here on every push, in parallel with the build. The tools are
  # pinned, each with the SHA-256 of its release archive.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck and actionlint
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p bin
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz -C bin --strip-components=1 "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C bin actionlint
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Check the shell scripts with shellcheck
        run: |
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION#v}"
          git ls-files -z '*.sh' | xargs -0 shellcheck

      # actionlint also runs shellcheck on every run: block.
      - name: Lint the workflows
        run: actionlint

      - name: Test the alert check against stand-ins
        run: bash deploy/alert-check.test.sh

      # systemd-analyze wants the executables the units start and the system's
      # own units, so it looks at ours inside a scratch root that has both.
      - name: Verify the systemd units
        run: |
          root=$RUNNER_TEMP/root
          mkdir -p "$root/etc/systemd/system" "$root/usr/lib/systemd"
          cp -R /usr/lib/systemd/system "$root/usr/lib/systemd/"
          # Some of the system's units are symlinks to files elsewhere (dracut's
          # are, on GitHub's runners), and inside the scratch root they lead
          # nowhere, which newer systemd reports. Each such link becomes a copy
          # of what it points to on this machine, or goes if nothing is there.
          # Masked units point to /dev/null, which systemd reads by name.
          find "$root/usr/lib/systemd/system" -type l ! -lname /dev/null -print0 |
            while IFS= read -r -d '' link; do
              target=$(readlink "$link")
              case $target in
                /*) inside=$root$target ;;
                *) inside=$(dirname "$link")/$target ;;
              esac
              [ -e "$inside" ] && continue
              real=$(readlink -f "${link#"$root"}") || real=
              rm "$link"
              if [ -n "$real" ] && [ -e "$real" ]; then cp -R "$real" "$link"; fi
            done
          sed -n 's/^ExecStart=\([^ ]*\).*/\1/p' deploy/*.service | sort -u | while read -r exe; do
            install -D -m 0755 /dev/null "$root$exe"
          done
          find deploy -maxdepth 1 \( -name '*.service' -o -name '*.timer' \) -exec cp -t "$root/etc/systemd/system" {} +
          units=()
          for f in "$root"/etc/systemd/system/*; do
            # A template is checked through an instance of it.
            units+=("${f/@./@check.}")
          done
          out=$(systemd-analyze verify --root="$root" "${units[@]}" 2>&1) || { echo "$out"; exit 1; }
          # An unknown key is only a warning: any output fails the step.
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
          echo "verified: ${units[*]##*/}"
