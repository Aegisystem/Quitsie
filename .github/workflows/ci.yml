name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web
        working-directory: web
        run: npm run typecheck

      - name: Test web
        working-directory: web
        run: npm test

      - name: Build web into api/cmd/server/dist
        working-directory: web
        run: npm run build

      # The same PostgreSQL as in development, from compose.yaml: the Go tests
      # and the end-to-end tests each make their own databases in it.
      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Vet Go
        working-directory: api
        run: go vet ./...

      - name: Test Go
        working-directory: api
        run: go test ./...

      - name: Scan Go for known vulnerabilities
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build server binary with the PWA embedded
        working-directory: api
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.sha }}" -o bin/quitsie ./cmd/server

      - name: Install Chromium for the end-to-end tests
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test the binary end to end
        working-directory: web
        timeout-minutes: 5
        run: npx playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: web/e2e/results
          retention-days: 7
          if-no-files-found: ignore

  # Railway builds this image from the Dockerfile; a change that breaks it
  # turns main red here instead of failing the deploy.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image Railway deploys
        run: docker build --build-arg RAILWAY_GIT_COMMIT_SHA=${{ github.sha }} -t quitsie .

  # The workflows only run in GitHub, so they are checked here on every push,
  # in parallel with the build. actionlint is pinned, with the SHA-256 of its
  # release archive.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p bin
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C bin actionlint
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Lint the workflows
        run: actionlint
