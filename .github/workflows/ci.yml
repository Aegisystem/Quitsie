name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web
        working-directory: web
        run: npm run typecheck

      - name: Test web
        working-directory: web
        run: npm test

      - name: Build web into api/cmd/server/dist
        working-directory: web
        run: npm run build

      - name: Vet Go
        working-directory: api
        run: go vet ./...

      - name: Test Go
        working-directory: api
        run: go test ./...

      - name: Scan Go for known vulnerabilities
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build server binary with the PWA embedded
        working-directory: api
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.sha }}" -o bin/quitsie ./cmd/server

      - name: Install Chromium for the end-to-end tests
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test the binary end to end
        working-directory: web
        timeout-minutes: 5
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          path: web/e2e/results
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: quitsie-linux-amd64
          path: api/bin/quitsie
          retention-days: 14
