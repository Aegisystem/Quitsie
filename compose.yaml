# PostgreSQL for development and tests: docker compose up -d
# The server reads QUITSIE_DATABASE_URL and the Go tests QUITSIE_TEST_DATABASE_URL;
# both default to this one. Port 5433 keeps clear of a PostgreSQL already on 5432.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quitsie
      POSTGRES_PASSWORD: quitsie
      POSTGRES_DB: quitsie
    ports:
      - "127.0.0.1:5433:5432"
    # Each test makes its own database; these trade durability, which a
    # development database does not need, for speed.
    command: postgres -c max_connections=500 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "quitsie"]
      interval: 1s
      retries: 30

volumes:
  postgres:
